name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  syntax-check:
    name: JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The main site (plain HTML/CSS/JS, no build step) — this just parses
      # every tracked .js file with Node and fails on a syntax error,
      # without executing any of it. react-poc/ is TypeScript/React and has
      # its own build check below (react-build), not covered by this loop
      # (git ls-files '*.js' doesn't match its .tsx files anyway).
      - name: Check every JS file parses
        run: |
          set -e
          for f in $(git ls-files '*.js' | grep -v '^react-poc/'); do
            echo "checking $f"
            node --check "$f"
          done

  smoke-test:
    name: Site loads + ticker search (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # The main site at /app/ is the React build, which is gitignored
      # (app/ is generated, not committed), so CI has to build it first or
      # /app/ would 404 and the smoke test would have nothing to check.
      - name: Build the React main site (app/)
        run: |
          cd react-poc
          npm ci
          npm run build
      # config.js is gitignored (holds real API keys locally) and isn't
      # fetched at all when deployed, so it doesn't exist here either.
      # The app needs *some* value in it to proceed past its
      # "no key configured" check — the real fetches are intercepted and
      # mocked in tests/smoke.spec.js, so this key is never actually used.
      - name: Create test-only config.js
        run: |
          cat > config.js <<'EOF'
          const FINNHUB_API_KEY = "ci-test-key";
          const TWELVE_DATA_API_KEY = "ci-test-key";
          const FRED_API_KEY = "ci-test-key";
          const COINGECKO_API_KEY = "ci-test-key";
          EOF
      - name: Run smoke test
        run: npm run test:smoke
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  react-build:
    name: React beta builds (typecheck + Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-poc/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Build-only: doesn't need a real msv-api response, since Vite just
      # bundles the code — it never runs it. Catches typecheck errors and
      # broken imports before they'd otherwise only surface when someone
      # runs `npm run build` by hand right before a deploy (see README.md's
      # "Deploying it").
      - name: Typecheck + production build
        run: npm run build

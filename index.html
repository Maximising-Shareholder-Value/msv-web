<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$MSV</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='23' fill='%231baf7a'/%3E%3Ctext x='24' y='30' text-anchor='middle' font-family='Arial' font-weight='700' font-size='15' fill='%23fff'%3EMSV%3C/text%3E%3C/svg%3E">
<script>
// The main site is now the React app (app/). This page only forwards
// visitors there. The previous vanilla homepage is kept as legacy.html.
(function () {
  var routes = {
 "home": "/app/?page=home",
 "explore-products": "/app/?page=explore",
 "stock-screener": "/app/?page=screener",
 "market-data": "/app/?page=market-data",
 "market-news": "/app/?page=news",
 "learn": "/app/?page=learn",
 "sectors": "/app/?page=sectors",
 "market-intelligence": "/app/?page=market-intel",
 "etfs": "/app/?page=etfs",
 "compare": "/app/?page=compare",
 "prediction-markets": "/app/?page=prediction-markets",
 "macro": "/app/?page=macro",
 "create-account": "/app/?page=placeholder&key=create-account",
 "login": "/app/?page=placeholder&key=login",
 "premium": "/app/?page=placeholder&key=premium",
 "performance": "/app/?page=placeholder&key=performance",
 "portfolio-builder": "/app/?page=placeholder&key=portfolio-builder",
 "portfolio-health-check": "/app/?page=placeholder&key=portfolio-health-check",
 "crypto": "/app/",
 "bitcoin-cycles": "/app/?tab=cycles",
 "crypto-news": "/app/?tab=news",
 "stock-analysis": "/app/?page=stock-analysis",
 "watchlist": "/app/?page=watchlist",
 "stock-ideas": "/app/?page=placeholder&key=stock-ideas",
 "stock-sentiment": "/app/?page=placeholder&key=stock-sentiment",
 "analyst-actions": "/app/?page=placeholder&key=analyst-actions",
 "precious-metals": "/app/?page=placeholder&key=precious-metals",
 "forex": "/app/?page=placeholder&key=forex",
 "insider-activity": "/app/?page=placeholder&key=insider-activity",
 "short-interest": "/app/?page=placeholder&key=short-interest",
 "energy-markets": "/app/?page=placeholder&key=energy-markets",
 "options-explorer": "/app/?page=placeholder&key=options-explorer",
 "energy-theme": "/app/?page=placeholder&key=energy-theme",
 "ev-theme": "/app/?page=placeholder&key=ev-theme",
 "defense-theme": "/app/?page=placeholder&key=defense-theme",
 "price-alerts": "/app/?page=placeholder&key=price-alerts",
 "dividend-tracker": "/app/?page=placeholder&key=dividend-tracker"
};
  var q = new URLSearchParams(location.search);
  var key = location.pathname.replace(/^\/+|\/+$/g, "");
  // Never bounce a React address: if one ever gets this page, stop instead of looping.
  // (documentElement, not body: this script runs in <head>, before <body> exists, so touching body threw an error.)
  if (location.pathname.indexOf("/app") === 0) { document.documentElement.setAttribute("data-stopped", "1"); return; }
  var target = routes[key] || "/app/?page=home";
  if (q.get("ticker")) target = "/app/?page=ticker&symbol=" + encodeURIComponent(q.get("ticker").toUpperCase());
  if (key === "" && q.get("ticker") === null && q.get("country")) target = "/app/?page=market-data&country=" + encodeURIComponent(q.get("country"));
  location.replace(target);
})();
</script>
</head>
<body>
<p style="font-family:sans-serif;padding:24px">Opening $MSV… <a href="/app/?page=home">continue</a></p>
</body>
</html>
